# Demote the C-Media USB PnP audio dongle (PCM2902) below the onboard codec.
#
# Out of the box this card ships with priority.session = 1109, which is higher
# than the onboard ALC897 (1009). WirePlumber therefore auto-selects the USB
# dongle as the default sink/source whenever priorities are recomputed (e.g.
# after a pipewire update), leaving you with no sound on the real speakers.
#
# Lowering its output node to 100 keeps the onboard codec as the preferred
# default sink while the USB device stays available for manual selection. The
# match is scoped to Audio/Sink so the USB capture (mic) node is left at its
# default priority and microphone selection is unaffected.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "USB PnP Sound Device"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver  = 100
      }
    }
  }
]
