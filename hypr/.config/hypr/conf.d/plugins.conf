###############
### PLUGINS ###
###############

# split-monitor-workspaces: awesomewm-style per-monitor workspaces.
# https://github.com/zjeffer/split-monitor-workspaces
#
# Install (one-time, requires sudo for the state store on first run):
#   hyprpm add https://github.com/zjeffer/split-monitor-workspaces
#   hyprpm enable split-monitor-workspaces
#   hyprpm reload
#
# After install, autostart.conf runs `hyprpm reload -n` each session.
#
# With count=10, monitor_priority orders which monitor gets the low ID range:
#   first entry  -> workspaces 1..10
#   second entry -> workspaces 11..20
# Bindings use split-workspace, N, which always means "the Nth workspace of the
# currently focused monitor", regardless of underlying ID.
#
# Caveat: monitor_priority takes connector names (DP-3, DP-2), not descriptions.
# If display ports get renumbered after a kernel/driver change, update this list.

plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
        enable_wrapping = 1
        link_monitors = 0
        # Mi Monitor first (workspaces 1-10), BenQ second (workspaces 11-20).
        monitor_priority = DP-3, DP-2
    }
}
