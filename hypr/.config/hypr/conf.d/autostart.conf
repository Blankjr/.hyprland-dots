#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = ~/.config/hypr/scripts/pin-workspaces-to-monitors.sh
exec-once = ~/.config/hypr/scripts/evict-from-special-ai.sh
exec-once = mako
exec-once = waybar
exec-once = wl-paste --watch cliphist store
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = ags run ~/.config/ags/app.ts &
exec-once = hyprpaper & ~/.config/hypr/scripts/random-wallpaper.sh
