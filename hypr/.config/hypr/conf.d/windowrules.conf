##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = floating-term
    match:class = floating-term

    float = yes
    size = 50% 40%
    center = yes
}

windowrule {
    name = keybind-helper
    match:class = keybind-helper

    float = yes
    size = 1200 450
    center = yes
}

# Claude Chat PWA
windowrule {
    name = claudechat
    match:class = chrome-claude.ai__-Default

    workspace = special:ai
    float = yes
    size = 1400 1000
    center = yes
}

# T3 Chat PWA
windowrule {
    name = t3chat
    match:class = chrome-t3.chat__-Default

    workspace = special:ai
    float = yes
    size = 1400 1000
    center = yes
}

# Non-AI windows are evicted from special:ai by
# ~/.config/hypr/scripts/evict-from-special-ai.sh (started in autostart.conf).

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}