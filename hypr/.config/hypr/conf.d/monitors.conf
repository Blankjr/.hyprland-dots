################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto

# Pin workspaces to outputs (like per-screen tags). Super+1–5 vs 6–0 (10).
# Uses description substrings from `hyprctl monitors` — survives DP-* renames better than connector names.
# default:true = each monitor's initial workspace; persistent:true = keep 1 and 6 alive when empty.
# Existing workspaces are NOT moved by rules alone — see exec-once pin script below (also run after reload if needed).
# If a monitor is unplugged, comment these lines or Hyprland may not apply the rule until it is back.
# https://wiki.hypr.land/Configuring/Workspace-Rules/
workspace = 1, monitor:desc:Xiaomi Corporation Mi Monitor, default:true, persistent:true
workspace = 2, monitor:desc:Xiaomi Corporation Mi Monitor
workspace = 3, monitor:desc:Xiaomi Corporation Mi Monitor
workspace = 4, monitor:desc:Xiaomi Corporation Mi Monitor
workspace = 5, monitor:desc:Xiaomi Corporation Mi Monitor
workspace = 6, monitor:desc:BenQ EW3270U, default:true, persistent:true
workspace = 7, monitor:desc:BenQ EW3270U
workspace = 8, monitor:desc:BenQ EW3270U
workspace = 9, monitor:desc:BenQ EW3270U
workspace = 10, monitor:desc:BenQ EW3270U
